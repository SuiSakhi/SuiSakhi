name: stitchsmart
description: "StitchSmart - Smart Tailoring App for iOS and Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  # Camera & AI measurement
  camera: ^0.11.1
  google_mlkit_pose_detection: ^0.14.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.2.1
  firebase_storage: ^12.3.4
  image_picker: ^1.1.2
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
